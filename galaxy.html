<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góc Yên ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #050510;
      font-family: 'Quicksand', sans-serif;
      cursor: grab;
    }

    body:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
    }

    /* Loading */
    #loading {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #050510 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 1.5s ease;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 16px;
      letter-spacing: 3px;
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: #ffd700;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 50;
      white-space: nowrap;
    }

    /* Modal */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 16, 0.7);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.4s ease;
    }

    #modal-overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-card {
      position: relative;
      max-width: 480px;
      width: 90%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 48px 36px 36px;
      text-align: center;
      animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalPop {
      from {
        transform: scale(0.8) translateY(30px);
        opacity: 0;
      }

      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .modal-icon {
      font-size: 52px;
      margin-bottom: 16px;
    }

    .modal-label {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .modal-content {
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      line-height: 1.8;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
    }

    .modal-content::-webkit-scrollbar {
      width: 4px;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .modal-date {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 22px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #ffd700;
    }

    /* Hint */
    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 14px;
      letter-spacing: 1px;
      z-index: 10;
      transition: opacity 2s;
      pointer-events: none;
    }

    /* Empty state */
    #empty-state {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      display: none;
    }

    #empty-state.active {
      display: block;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-text {
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="loader"></div>
    <div class="loader-text">Đang mở vũ trụ...</div>
  </div>
  <div id="tooltip"></div>
  <div id="hint">💌 Click vào lá thư để đọc thông điệp</div>
  <div id="empty-state">
    <div class="empty-icon">🌌</div>
    <div class="empty-text">Chưa có thông điệp nào...<br>Hãy là người đầu tiên gửi! ✨</div>
  </div>

  <div id="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-icon">💌</div>
      <div class="modal-label">Thông điệp từ vũ trụ</div>
      <div class="modal-content" id="modal-text"></div>
      <div class="modal-date" id="modal-date"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Supabase ──
    const sb = window.supabase.createClient(
      'https://zdpfelmwmmtunarzbiyi.supabase.co',
      'sb_publishable_jYSh24DFZq2uwRGnEpLJqQ_bY6DPfEs'
    );

    // ── Scene setup ──
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.012);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 12, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 5;
    controls.maxDistance = 60;
    controls.enablePan = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;

    // ── Lights ──
    scene.add(new THREE.AmbientLight(0x222244, 0.8));
    const coreLight = new THREE.PointLight(0xffeedd, 3, 30);
    scene.add(coreLight);
    const rimLight = new THREE.PointLight(0x6644ff, 1.5, 40);
    rimLight.position.set(10, 5, -10);
    scene.add(rimLight);

    // ── Helpers ──
    function makeTexture(draw, size = 64) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      draw(c.getContext('2d'), size);
      return new THREE.CanvasTexture(c);
    }

    const dotTex = makeTexture((ctx, s) => {
      const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.3, 'rgba(255,255,255,0.5)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    });

    const glowTex = makeTexture((ctx, s) => {
      const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      g.addColorStop(0, 'rgba(255,215,0,0.5)');
      g.addColorStop(0.4, 'rgba(255,180,50,0.15)');
      g.addColorStop(1, 'rgba(255,100,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    }, 128);

    // ── Background stars ──
    function createStars() {
      const count = 4000;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const r = 40 + Math.random() * 80;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i * 3 + 2] = r * Math.cos(phi);
        sizes[i] = 0.3 + Math.random() * 0.7;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      const mat = new THREE.PointsMaterial({
        map: dotTex, size: 0.3, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false,
        color: 0xccccff, opacity: 0.8
      });
      scene.add(new THREE.Points(geo, mat));
    }
    createStars();

    // ── Galaxy spiral ──
    function createGalaxy() {
      const count = 18000;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const arms = 3, spin = 1.8, radius = 16;

      const inner = new THREE.Color(0xffeedd);
      const mid = new THREE.Color(0x8866ff);
      const outer = new THREE.Color(0xff4488);

      for (let i = 0; i < count; i++) {
        const r = Math.pow(Math.random(), 1.5) * radius;
        const armAngle = (i % arms) * (Math.PI * 2 / arms);
        const spinAngle = r * spin;
        const scatter = Math.pow(r / radius, 0.6) * 1.8;

        pos[i * 3] = Math.cos(armAngle + spinAngle) * r + (Math.random() - 0.5) * scatter;
        pos[i * 3 + 1] = (Math.random() - 0.5) * (0.3 + r * 0.04);
        pos[i * 3 + 2] = Math.sin(armAngle + spinAngle) * r + (Math.random() - 0.5) * scatter;

        const t = r / radius;
        const c = t < 0.3 ? inner.clone().lerp(mid, t / 0.3) : mid.clone().lerp(outer, (t - 0.3) / 0.7);
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        map: dotTex, size: 0.12, vertexColors: true, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9
      });
      const points = new THREE.Points(geo, mat);
      scene.add(points);
      return points;
    }
    const galaxy = createGalaxy();

    // ── Galaxy core glow ──
    const coreMat = new THREE.SpriteMaterial({
      map: makeTexture((ctx, s) => {
        const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        g.addColorStop(0, 'rgba(255,240,220,0.8)');
        g.addColorStop(0.15, 'rgba(255,200,150,0.4)');
        g.addColorStop(0.4, 'rgba(140,100,255,0.15)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
      }, 256),
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
    });
    const coreSprite = new THREE.Sprite(coreMat);
    coreSprite.scale.set(12, 12, 1);
    scene.add(coreSprite);

    // ── Shooting stars ──
    const shootingStars = [];
    class ShootingStar {
      constructor() {
        const pts = [];
        for (let i = 0; i < 20; i++) pts.push(new THREE.Vector3(0, 0, 0));
        this.geo = new THREE.BufferGeometry().setFromPoints(pts);
        const colors = new Float32Array(20 * 4);
        for (let i = 0; i < 20; i++) {
          const t = i / 19;
          colors[i * 4] = 0.7 + t * 0.3; colors[i * 4 + 1] = 0.8 + t * 0.2;
          colors[i * 4 + 2] = 1; colors[i * 4 + 3] = t;
        }
        this.geo.setAttribute('color', new THREE.BufferAttribute(colors, 4));
        this.mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
        this.line = new THREE.Line(this.geo, this.mat);
        scene.add(this.line);
        this.active = false; this.timer = Math.random() * 500;
        this.positions = []; this.head = new THREE.Vector3();
        this.vel = new THREE.Vector3();
      }
      spawn() {
        this.head.set((Math.random() - 0.5) * 50, 15 + Math.random() * 15, (Math.random() - 0.5) * 50);
        this.vel.set((Math.random() - 0.5) * 1.5, -(1 + Math.random()), (Math.random() - 0.5) * 1.5).normalize().multiplyScalar(0.8 + Math.random() * 0.6);
        this.positions = [];
        for (let i = 0; i < 20; i++) this.positions.push(this.head.clone());
        this.life = 80 + Math.random() * 60;
        this.active = true;
      }
      update() {
        if (!this.active) { this.timer--; if (this.timer <= 0) this.spawn(); return; }
        this.head.add(this.vel);
        this.positions.pop();
        this.positions.unshift(this.head.clone());
        const posArr = this.geo.attributes.position.array;
        for (let i = 0; i < 20; i++) {
          posArr[i * 3] = this.positions[i].x;
          posArr[i * 3 + 1] = this.positions[i].y;
          posArr[i * 3 + 2] = this.positions[i].z;
        }
        this.geo.attributes.position.needsUpdate = true;
        this.life--;
        if (this.life <= 0) { this.active = false; this.timer = 200 + Math.random() * 400; }
      }
    }
    for (let i = 0; i < 5; i++) shootingStars.push(new ShootingStar());

    // ── Nebula clouds ──
    function addNebula(x, y, z, color, scale) {
      const mat = new THREE.SpriteMaterial({
        map: makeTexture((ctx, s) => {
          const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
          g.addColorStop(0, color + '33');
          g.addColorStop(0.5, color + '11');
          g.addColorStop(1, color + '00');
          ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
        }, 128),
        blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
      });
      const s = new THREE.Sprite(mat);
      s.position.set(x, y, z);
      s.scale.set(scale, scale, 1);
      scene.add(s);
    }
    addNebula(8, 1, -6, '#8844ff', 14);
    addNebula(-10, -0.5, 5, '#ff4488', 12);
    addNebula(3, 0.5, 10, '#4488ff', 10);

    // ── Envelope meshes ──
    const envelopes = [];
    const envelopeGroup = new THREE.Group();
    scene.add(envelopeGroup);
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function createEnvelope(msg, index, total) {
      const group = new THREE.Group();
      group.userData = { message: msg };

      // Body
      const bodyGeo = new THREE.BoxGeometry(0.7, 0.45, 0.04);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0xfff5e0, emissive: 0xffd700, emissiveIntensity: 0.15,
        roughness: 0.5, metalness: 0.05
      });
      group.add(new THREE.Mesh(bodyGeo, bodyMat));

      // Flap triangle
      const flapGeo = new THREE.BufferGeometry();
      const v = new Float32Array([
        -0.35, 0.225, 0.021, 0.35, 0.225, 0.021, 0, 0.02, 0.021,
        -0.35, 0.225, -0.021, 0.35, 0.225, -0.021, 0, 0.02, -0.021
      ]);
      const idx = [0, 1, 2, 3, 5, 4];
      flapGeo.setAttribute('position', new THREE.BufferAttribute(v, 3));
      flapGeo.setIndex(idx);
      flapGeo.computeVertexNormals();
      const flapMat = new THREE.MeshStandardMaterial({
        color: 0xffe4b5, emissive: 0xffa500, emissiveIntensity: 0.1,
        side: THREE.DoubleSide, roughness: 0.5
      });
      group.add(new THREE.Mesh(flapGeo, flapMat));

      // Heart seal
      const heartGeo = new THREE.CircleGeometry(0.05, 12);
      const heartMat = new THREE.MeshStandardMaterial({
        color: 0xff3366, emissive: 0xff0044, emissiveIntensity: 0.6,
        side: THREE.DoubleSide
      });
      const heart = new THREE.Mesh(heartGeo, heartMat);
      heart.position.set(0, 0.12, 0.025);
      group.add(heart);

      // Glow sprite
      const gs = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, blending: THREE.AdditiveBlending,
        transparent: true, depthWrite: false, opacity: 0.7
      }));
      gs.scale.set(1.8, 1.8, 1);
      group.add(gs);

      // Orbit parameters
      const minR = 4, maxR = 14;
      const orbitR = minR + (index / Math.max(total - 1, 1)) * (maxR - minR) + (Math.random() - 0.5) * 1.5;
      group.userData.orbit = {
        radius: Math.max(3.5, orbitR),
        speed: 0.08 + Math.random() * 0.08,
        phase: (index / total) * Math.PI * 2 + Math.random() * 0.5,
        tiltX: (Math.random() - 0.5) * 0.35,
        tiltZ: (Math.random() - 0.5) * 0.35,
        bobSpeed: 0.5 + Math.random() * 0.5,
        bobAmp: 0.3 + Math.random() * 0.3,
        bobPhase: Math.random() * Math.PI * 2,
        selfSpin: 0.2 + Math.random() * 0.3
      };

      group.scale.set(0.8, 0.8, 0.8);
      envelopeGroup.add(group);
      envelopes.push(group);
    }

    // ── Load messages ──
    async function loadMessages() {
      try {
        const { data, error } = await sb.from('messages').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) {
          document.getElementById('empty-state').classList.add('active');
          document.getElementById('hint').style.display = 'none';
        } else {
          data.forEach((msg, i) => createEnvelope(msg, i, data.length));
        }
      } catch (e) {
        console.error('Failed to load messages:', e);
      }
      // Hide loading
      setTimeout(() => {
        document.getElementById('loading').classList.add('hide');
      }, 800);
    }
    loadMessages();

    // ── Interaction ──
    const tooltip = document.getElementById('tooltip');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalText = document.getElementById('modal-text');
    const modalDate = document.getElementById('modal-date');
    let hoveredEnvelope = null;

    function onPointerMove(e) {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(envelopeGroup.children, true);
      if (hits.length > 0) {
        let target = hits[0].object;
        while (target.parent && target.parent !== envelopeGroup) target = target.parent;
        if (target.userData.message) {
          hoveredEnvelope = target;
          renderer.domElement.style.cursor = 'pointer';
          tooltip.textContent = '💌 Click để đọc thông điệp';
          tooltip.style.left = e.clientX + 15 + 'px';
          tooltip.style.top = e.clientY - 10 + 'px';
          tooltip.style.opacity = '1';
          return;
        }
      }
      hoveredEnvelope = null;
      renderer.domElement.style.cursor = 'grab';
      tooltip.style.opacity = '0';
    }

    function onClick(e) {
      if (!hoveredEnvelope) return;
      const msg = hoveredEnvelope.userData.message;
      modalText.textContent = msg.content;
      const d = new Date(msg.created_at);
      modalDate.textContent = d.toLocaleDateString('vi-VN', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      modalOverlay.classList.add('active');
      controls.autoRotate = false;
    }

    document.getElementById('modal-close').addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      controls.autoRotate = true;
    });
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
        controls.autoRotate = true;
      }
    });

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('click', onClick);
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Hide hint after 6s
    setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 6000);

    // ── Animation loop ──
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const dt = clock.getDelta();

      // Rotate galaxy
      galaxy.rotation.y = t * 0.02;

      // Shooting stars
      shootingStars.forEach(s => s.update());

      // Envelope orbits
      envelopes.forEach(env => {
        const o = env.userData.orbit;
        const angle = o.phase + t * o.speed;
        const x = Math.cos(angle) * o.radius;
        const z = Math.sin(angle) * o.radius;
        const y = Math.sin(t * o.bobSpeed + o.bobPhase) * o.bobAmp + Math.sin(angle) * o.tiltX * o.radius * 0.3;
        env.position.set(
          x + Math.sin(angle) * o.tiltZ * 0.5,
          y,
          z + Math.cos(angle) * o.tiltX * 0.5
        );
        env.rotation.y = t * o.selfSpin;
        env.rotation.x = Math.sin(t * 0.3 + o.bobPhase) * 0.15;

        // Pulse glow for hovered
        if (env === hoveredEnvelope) {
          env.scale.setScalar(0.95 + Math.sin(t * 5) * 0.08);
        } else {
          env.scale.setScalar(0.8);
        }
      });

      // Core light flicker
      coreLight.intensity = 3 + Math.sin(t * 0.7) * 0.3;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>

</html>
