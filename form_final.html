<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Message Background Preview</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", sans-serif;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes softFloat {
      0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
      50% { transform: translateY(-14px) rotate(calc(var(--r, 0deg) + 8deg)); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.65; scale: 1; }
      50% { opacity: 1; scale: 1.22; }
    }

    @keyframes panelBreath {
      0%, 100% { border-radius: 58% 42% 45% 55% / 8% 10% 12% 14%; }
      50% { border-radius: 45% 55% 58% 42% / 12% 8% 14% 10%; }
    }

    @keyframes boxBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes leafSwayLeft {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(1deg); }
    }

    @keyframes leafSwayRight {
      0%, 100% { transform: rotate(3deg) scaleX(-1); }
      50% { transform: rotate(-1deg) scaleX(-1); }
    }

    @keyframes flowerSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes flyHeart {
      0% { opacity: 0; transform: translateY(0) scale(0.6) rotate(0deg); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-170px) scale(1.35) rotate(22deg); }
    }

    @keyframes iconDrift {
      0%, 100% { transform: translateY(0) rotate(var(--rotate, 0deg)); opacity: 0.55; }
      50% { transform: translateY(-18px) rotate(calc(var(--rotate, 0deg) + 10deg)); opacity: 0.95; }
    }

    @keyframes boxGlow {
      0%, 100% { filter: drop-shadow(0 18px 18px rgba(242, 56, 145, 0.18)); }
      50% { filter: drop-shadow(0 24px 26px rgba(242, 56, 145, 0.28)); }
    }

    @keyframes mailPeek {
      0%, 100% { transform: translateY(0) rotate(8deg); }
      50% { transform: translateY(-24px) rotate(4deg); }
    }

    .cute-bg {
      min-height: 100vh;
      width: 100%;
      padding: 34px;
      background:
        radial-gradient(circle at 8% 86%, #f5489b 0 13%, transparent 14%),
        radial-gradient(circle at 96% 5%, #fff06a 0 20%, transparent 21%),
        radial-gradient(circle at 100% 70%, #fff06a 0 14%, transparent 15%),
        radial-gradient(circle at 0% 4%, #f5489b 0 18%, transparent 19%),
        linear-gradient(135deg, #f84da1, #fff06a 62%, #7eeadd);
      background-size: 170% 170%;
      animation: gradientMove 10s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .white-panel {
      position: relative;
      width: min(1320px, 100%);
      min-height: 720px;
      background: #fffaf4;
      border: 18px solid #82eadf;
      border-radius: 58% 42% 45% 55% / 8% 10% 12% 14%;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      animation: panelBreath 9s ease-in-out infinite;
    }

    .white-panel::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 3px dashed rgba(86, 202, 196, 0.35);
      border-radius: 58% 42% 45% 55% / 8% 10% 12% 14%;
      pointer-events: none;
    }

    .white-panel::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -30px;
      width: 100%;
      height: 145px;
      background:
        radial-gradient(circle at 12% 65%, #f5489b 0 18%, transparent 19%),
        radial-gradient(circle at 42% 100%, #fff06a 0 30%, transparent 31%),
        radial-gradient(circle at 60% 98%, #82eadf 0 23%, transparent 24%),
        radial-gradient(circle at 78% 90%, #f5489b 0 23%, transparent 24%);
      opacity: 0.95;
    }

    .content-area {
      position: relative;
      z-index: 8;
      width: min(620px, 70%);
      margin: 175px auto 0;
      text-align: center;
      animation: popIn 0.9s ease-out both;
    }

    .content-area h1 {
      margin: 0 0 12px;
      color: #f23891;
      font-size: clamp(32px, 5vw, 58px);
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .content-area p {
      margin: 0 auto 28px;
      max-width: 520px;
      color: #6e6e6e;
      font-size: 18px;
      line-height: 1.6;
    }

    .message-form {
      display: grid;
      gap: 14px;
    }

    .message-form textarea {
      min-height: 130px;
      resize: none;
      border: 3px solid #82eadf;
      border-radius: 26px;
      padding: 18px 20px;
      background: white;
      color: #333;
      font-size: 16px;
      outline: none;
      box-shadow: 0 10px 0 rgba(126, 234, 221, 0.25);
    }

    .message-form textarea:focus { border-color: #f23891; }

    .message-form button {
      justify-self: center;
      border: none;
      border-radius: 999px;
      padding: 15px 32px;
      background: #f23891;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 0 #ca2374;
      transition: 0.2s;
      position: relative;
      overflow: visible;
    }

    .message-form button:hover {
      transform: translateY(-3px);
      box-shadow: 0 11px 0 #ca2374;
    }

    .decor {
      position: absolute;
      z-index: 4;
      font-weight: 900;
      line-height: 1;
    }

    .star-outline {
      color: transparent;
      -webkit-text-stroke: 5px #fffaf4;
      text-shadow: 0 0 0 #fff06a;
      font-size: 76px;
    }

    .small-star { color: #82eadf; font-size: 38px; }

    .heart {
      color: #f23891;
      font-size: 72px;
      text-shadow: 4px 4px 0 #82eadf, -3px -3px 0 #fffaf4;
      transform: rotate(-8deg);
    }

    .grey-star {
      color: #b9b9b9;
      font-size: 38px;
      text-shadow: 2px 2px 0 white;
    }

    .yellow-star { color: #fff06a; font-size: 32px; }

    .pink-star {
      color: #f23891;
      font-size: 72px;
      text-shadow: 3px 3px 0 white;
    }

    .top-left { top: 22px; left: 30px; --r: -8deg; animation: softFloat 4.8s ease-in-out infinite; }
    .top-left-2 { top: 28px; left: 140px; --r: 12deg; animation: twinkle 2.2s ease-in-out infinite; }
    .top-right { top: 56px; right: 65px; --r: -8deg; animation: softFloat 4s ease-in-out infinite; }
    .right-star { top: 165px; right: 155px; animation: twinkle 2.8s ease-in-out infinite; }
    .right-yellow { top: 185px; right: 70px; animation: twinkle 2.1s ease-in-out infinite 0.4s; }
    .bottom-left { left: 100px; bottom: 130px; --r: 4deg; animation: softFloat 5.2s ease-in-out infinite 0.2s; }
    .bottom-grey { left: 390px; bottom: 55px; animation: twinkle 3s ease-in-out infinite 0.7s; }
    .bottom-yellow { right: 440px; bottom: 105px; animation: twinkle 2.5s ease-in-out infinite 0.3s; }

    .swirl {
      position: absolute;
      z-index: 4;
      color: #5ed0ca;
      font-size: 100px;
      font-weight: 300;
      transform: rotate(35deg);
      opacity: 0.9;
    }

    .left-swirl { left: 22px; top: 150px; }
    .right-swirl { right: 20px; top: 255px; }

    /* Leaf element đã sửa: 1 SVG hoàn chỉnh, lá trên cùng nằm giữa cành và che ngọn */
    .left-leaf, .right-leaf {
      position: absolute;
      z-index: 4;
      width: 178px;
      height: 268px;
      transform-origin: bottom center;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      background-image: url("data:image/svg+xml,%3Csvg width='220' height='330' viewBox='0 0 220 330' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M72 312C92 272 108 232 116 190C124 147 127 100 132 50' stroke='%23fffaf4' stroke-width='22' stroke-linecap='round'/%3E%3Cpath d='M72 312C92 272 108 232 116 190C124 147 127 100 132 50' stroke='%237ee8dd' stroke-width='13' stroke-linecap='round'/%3E%3Cpath d='M88 235C46 230 14 196 17 158C58 154 94 187 88 235Z' fill='%237ee8dd' stroke='%23fffaf4' stroke-width='10' stroke-linejoin='round'/%3E%3Cpath d='M98 236C136 194 190 188 210 218C172 260 124 264 98 236Z' fill='%237ee8dd' stroke='%23fffaf4' stroke-width='10' stroke-linejoin='round'/%3E%3Cpath d='M119 154C78 146 50 107 63 75C101 78 127 116 119 154Z' fill='%237ee8dd' stroke='%23fffaf4' stroke-width='10' stroke-linejoin='round'/%3E%3Cpath d='M128 156C151 113 193 98 211 125C195 165 157 179 128 156Z' fill='%237ee8dd' stroke='%23fffaf4' stroke-width='10' stroke-linejoin='round'/%3E%3Cpath d='M132 88C105 62 111 24 140 9C170 33 167 70 132 88Z' fill='%237ee8dd' stroke='%23fffaf4' stroke-width='10' stroke-linejoin='round'/%3E%3Cpath d='M80 230C61 203 43 181 23 160' stroke='%234abfb7' stroke-width='4' stroke-linecap='round' opacity='.35'/%3E%3Cpath d='M105 232C137 224 169 219 203 218' stroke='%234abfb7' stroke-width='4' stroke-linecap='round' opacity='.35'/%3E%3Cpath d='M115 149C101 122 83 98 65 77' stroke='%234abfb7' stroke-width='4' stroke-linecap='round' opacity='.35'/%3E%3Cpath d='M134 151C154 138 178 128 207 124' stroke='%234abfb7' stroke-width='4' stroke-linecap='round' opacity='.35'/%3E%3Cpath d='M134 82C134 58 137 34 140 13' stroke='%234abfb7' stroke-width='4' stroke-linecap='round' opacity='.35'/%3E%3C/svg%3E");
    }

    .left-leaf {
      left: -18px;
      bottom: 95px;
      transform: rotate(-3deg);
      animation: leafSwayLeft 5.5s ease-in-out infinite;
    }

    .right-leaf {
      right: -6px;
      bottom: 62px;
      transform: rotate(3deg) scaleX(-1);
      animation: leafSwayRight 5.5s ease-in-out infinite;
    }

    .flower {
      position: absolute;
      z-index: 5;
      right: 43px;
      bottom: 35px;
      width: 86px;
      height: 86px;
      animation: flowerSpin 10s linear infinite;
    }

    .flower span {
      position: absolute;
      width: 42px;
      height: 42px;
      background: #f23891;
      border-radius: 50%;
    }

    .flower span:nth-child(1) { top: 0; left: 22px; }
    .flower span:nth-child(2) { top: 22px; right: 0; }
    .flower span:nth-child(3) { bottom: 0; left: 22px; }
    .flower span:nth-child(4) { top: 22px; left: 0; }

    .flower b {
      position: absolute;
      top: 29px;
      left: 29px;
      width: 28px;
      height: 28px;
      background: #fff06a;
      border-radius: 50%;
    }

    .message-box {
      position: absolute;
      z-index: 7;
      right: 82px;
      bottom: 88px;
      width: 360px;
      height: 270px;
      animation: boxBounce 4.5s ease-in-out infinite, boxGlow 3.5s ease-in-out infinite;
    }

    .paper {
      position: absolute;
      right: 90px;
      top: 4px;
      width: 128px;
      height: 104px;
      background: linear-gradient(145deg, #fff7fb, #ffd8ec);
      border: 3px solid #f3a6cb;
      border-radius: 18px;
      transform: rotate(8deg);
      animation: mailPeek 3s ease-in-out infinite;
      box-shadow: 0 12px 18px rgba(242, 56, 145, 0.16);
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 18px 16px auto;
      height: 3px;
      background: rgba(242, 56, 145, 0.28);
      border-radius: 999px;
      box-shadow: 0 17px 0 rgba(242, 56, 145, 0.22), 0 34px 0 rgba(242, 56, 145, 0.18);
    }

    .paper::after {
      content: "♥";
      position: absolute;
      right: -22px;
      top: 18px;
      color: #f23891;
      font-size: 42px;
    }

    .box-top {
      position: absolute;
      top: 76px;
      left: 10px;
      width: 340px;
      height: 72px;
      background: linear-gradient(180deg, #ff63b0, #f23891);
      transform: perspective(520px) rotateX(58deg);
      transform-origin: bottom;
      border: 3px solid #d61f7a;
      border-radius: 32px 32px 12px 12px;
      box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.25);
    }

    .box-top::before {
      content: "";
      position: absolute;
      left: 84px;
      top: 28px;
      width: 170px;
      height: 16px;
      background: #21151c;
      border-radius: 999px;
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.12);
    }

    .box-front {
      position: absolute;
      left: 22px;
      top: 122px;
      width: 316px;
      height: 132px;
      background: linear-gradient(160deg, #fff575, #ffe45b 58%, #ffd94a);
      border: 3px solid #e6c43b;
      border-radius: 24px 24px 38px 38px;
      box-shadow: inset 0 10px 0 rgba(255, 255, 255, 0.26), 0 16px 22px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .box-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 24%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
        radial-gradient(circle at 82% 34%, rgba(255,255,255,0.35) 0 5px, transparent 6px),
        radial-gradient(circle at 68% 78%, rgba(255,255,255,0.3) 0 4px, transparent 5px);
    }

    .box-heart {
      position: absolute;
      left: 76px;
      top: 32px;
      color: #f23891;
      font-size: 76px;
      line-height: 1;
      text-shadow: 4px 4px 0 white, -3px -3px 0 white;
      animation: softFloat 2.8s ease-in-out infinite;
    }

    .soft-icon {
      position: absolute;
      z-index: 4;
      color: var(--c);
      font-size: var(--s);
      opacity: 0.72;
      pointer-events: none;
      animation: iconDrift var(--d) ease-in-out infinite;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.9);
    }

    .icon-1 { left: 235px; top: 120px; --c: #f23891; --s: 28px; --d: 4.2s; --rotate: -12deg; }
    .icon-2 { left: 330px; top: 250px; --c: #82eadf; --s: 30px; --d: 5s; --rotate: 18deg; }
    .icon-3 { left: 215px; bottom: 245px; --c: #fff06a; --s: 26px; --d: 3.6s; --rotate: 10deg; }
    .icon-4 { right: 385px; top: 145px; --c: #f23891; --s: 26px; --d: 4.7s; --rotate: 15deg; }
    .icon-5 { right: 470px; bottom: 250px; --c: #82eadf; --s: 32px; --d: 5.4s; --rotate: -18deg; }
    .icon-6 { right: 300px; bottom: 320px; --c: #b9b9b9; --s: 25px; --d: 4.1s; --rotate: 20deg; }
    .icon-7 { left: 505px; top: 125px; --c: #82eadf; --s: 22px; --d: 3.8s; --rotate: -5deg; }
    .icon-8 { right: 545px; top: 265px; --c: #fff06a; --s: 24px; --d: 4.9s; --rotate: 6deg; }
    .icon-9 { left: 470px; bottom: 170px; --c: #f23891; --s: 22px; --d: 4.3s; --rotate: -20deg; }

    .sparkle-dot {
      position: absolute;
      z-index: 3;
      width: var(--size);
      height: var(--size);
      border-radius: 999px;
      background: var(--c);
      opacity: 0.7;
      animation: twinkle var(--d) ease-in-out infinite;
    }

    .dot-1 { left: 260px; top: 340px; --size: 11px; --c: #f23891; --d: 2.5s; }
    .dot-2 { left: 570px; top: 180px; --size: 9px; --c: #82eadf; --d: 3s; }
    .dot-3 { right: 520px; top: 400px; --size: 12px; --c: #82eadf; --d: 2.7s; }
    .dot-4 { right: 660px; bottom: 190px; --size: 8px; --c: #f23891; --d: 2.2s; }
    .dot-5 { left: 720px; bottom: 230px; --size: 10px; --c: #fff06a; --d: 3.1s; }

    .floating-heart {
      position: absolute;
      z-index: 20;
      right: 170px;
      bottom: 220px;
      color: #f23891;
      font-size: 34px;
      pointer-events: none;
      animation: flyHeart 1.6s ease-out forwards;
      text-shadow: 2px 2px 0 white;
    }

    @media (max-width: 768px) {
      .cute-bg { padding: 14px; }
      .white-panel { min-height: 100vh; border-width: 12px; }
      .content-area { width: 86%; margin-top: 145px; }
      .message-box {
        right: 10px;
        bottom: 50px;
        transform: scale(0.65);
        transform-origin: bottom right;
        animation: none;
      }
      .top-right, .right-star, .right-yellow, .right-swirl, .right-leaf, .flower, .soft-icon, .sparkle-dot { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="cute-bg">
    <div class="white-panel">
      <div class="decor star-outline top-left">☆</div>
      <div class="decor small-star top-left-2">★</div>
      <div class="decor heart top-right">♥</div>
      <div class="decor grey-star right-star">★</div>
      <div class="decor yellow-star right-yellow">★</div>
      <div class="decor pink-star bottom-left">★</div>
      <div class="decor grey-star bottom-grey">★</div>
      <div class="decor yellow-star bottom-yellow">★</div>

      <div class="swirl left-swirl">⌇</div>
      <div class="swirl right-swirl">⌇</div>

      <div class="leaf left-leaf"></div>
      <div class="leaf right-leaf"></div>

      <div class="flower"><span></span><span></span><span></span><span></span><b></b></div>

      <div class="soft-icon icon-1">♡</div>
      <div class="soft-icon icon-2">✦</div>
      <div class="soft-icon icon-3">✿</div>
      <div class="soft-icon icon-4">✧</div>
      <div class="soft-icon icon-5">♡</div>
      <div class="soft-icon icon-6">✦</div>
      <div class="soft-icon icon-7">✧</div>
      <div class="soft-icon icon-8">✿</div>
      <div class="soft-icon icon-9">♡</div>

      <span class="sparkle-dot dot-1"></span>
      <span class="sparkle-dot dot-2"></span>
      <span class="sparkle-dot dot-3"></span>
      <span class="sparkle-dot dot-4"></span>
      <span class="sparkle-dot dot-5"></span>

      <div class="message-box">
        <div class="paper"></div>
        <div class="box-top"></div>
        <div class="box-front"><div class="box-heart">♥</div></div>
      </div>

      <div class="content-area">
        <h1>Chào cục dènnn</h1>
        <p>Hôm nay lòng cục dèn yên chưa?</p>
        <form class="message-form">
          <textarea placeholder="Nhập lời nhắn của bạn..."></textarea>
          <button type="button" id="sendBtn">Gửi</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Transition overlay -->
  <div id="transition-overlay" style="position:fixed;inset:0;background:#050510;z-index:9999;opacity:0;pointer-events:none;transition:opacity 1.2s ease;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center;color:white;font-family:'Quicksand',sans-serif;">
      <div style="font-size:48px;margin-bottom:12px;">✨</div>
      <div style="font-size:20px;opacity:0.8;letter-spacing:2px;">Đang mở dải ngân hà...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://zdpfelmwmmtunarzbiyi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_jYSh24DFZq2uwRGnEpLJqQ_bY6DPfEs';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const btn = document.getElementById("sendBtn");
    const panel = document.querySelector(".white-panel");
    const textarea = document.querySelector(".message-form textarea");

    function spawnHearts() {
      for (let i = 0; i < 12; i++) {
        const heart = document.createElement("span");
        heart.className = "floating-heart";
        heart.textContent = ["♥", "★", "✦", "💌"][Math.floor(Math.random() * 4)];
        heart.style.right = `${80 + Math.random() * 240}px`;
        heart.style.bottom = `${120 + Math.random() * 160}px`;
        heart.style.color = ["#f23891", "#82eadf", "#fff06a", "#b9b9b9"][Math.floor(Math.random() * 4)];
        heart.style.animationDelay = `${Math.random() * 0.4}s`;
        panel.appendChild(heart);
        setTimeout(() => heart.remove(), 1900);
      }
    }

    btn.addEventListener("click", async () => {
      const content = textarea.value.trim();
      if (!content) {
        textarea.style.borderColor = '#f23891';
        textarea.setAttribute('placeholder', 'Hãy viết gì đó nhé... 💕');
        textarea.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang gửi... 💌';
      spawnHearts();

      try {
        const { error } = await sb.from('messages').insert([
          { display_name: 'Ẩn danh', content: content }
        ]);

        if (error) throw error;

        btn.textContent = 'Đã gửi! ✨';
        textarea.value = '';

        // Transition to galaxy
        setTimeout(() => {
          const overlay = document.getElementById('transition-overlay');
          overlay.style.opacity = '1';
          overlay.style.pointerEvents = 'all';
          setTimeout(() => {
            window.location.href = 'galaxy.html';
          }, 1300);
        }, 800);

      } catch (err) {
        console.error('Supabase error:', err);
        btn.disabled = false;
        btn.textContent = 'Thử lại 💔';
        alert('Không gửi được, vui lòng thử lại!');
      }
    });
  </script>
</body>
</html>
